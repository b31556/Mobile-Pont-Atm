; Pont reader: ESP32 DevKit V1 + MFRC522 + TM1637 4-digit display.
; Build and flash:  pio run -t upload      Watch the log:  pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    https://github.com/avishorp/TM1637.git#v1.2.0
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11
