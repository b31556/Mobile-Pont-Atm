# Pont ATM: https for pont.example.com. The app itself listens on 127.0.0.1:3000 only (settings: /etc/pont/env).
server {
    listen 80;
    server_name pont.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pont.example.com;

    ssl_certificate /etc/letsencrypt/live/pont.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pont.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 3m;   # card photos are limited to 2 MB by the app

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwritten, never appended to: the app believes this header from nginx only, so a client must not be able to add to it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The Android app, to install on a phone: open https://pont.example.com/app
    location = /app {
        alias /var/www/pont/pont-atm.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="pont-atm.apk"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /app/ { return 301 /app; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }

    # The live display screens: a long-lived stream that must not be buffered.
    location = /display/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
