<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12202B">
<title>Program</title>
<style>
/* The program as lanes: one row per event, time across, so you see what runs when and what overlaps. Pont Card palette. */
:root {
  --page:#F5F0E4; --bg:#FBF7EF; --surface:#FFFFFF; --ink:#12202B; --ink2:#4A5B68; --ink3:#6F7F8B; --line:#E8E1D3;
  --green:#0F7F37; --green-soft:#DDF4E5; --on-green:#FFFFFF; --red:#C0342C; --red-soft:#FBE4E2;
  --amber:#F5B31F; --amber-soft:#FFF1CF; --amber-ink:#6B4A00; --mix:#2B4A63; --mix-soft:#E3ECF3;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page:#0A1319; --bg:#0F1A22; --surface:#182630; --ink:#F2F5F7; --ink2:#B6C3CC; --ink3:#8A9AA6; --line:#263541;
  --green:#5BD58A; --green-soft:#16352A; --on-green:#0B2A17; --red:#FF8A82; --red-soft:#3B2024;
  --amber-soft:#3A2F14; --amber-ink:#F5D27A; --mix:#9FC1DD; --mix-soft:#1F3342; color-scheme: dark; } }
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 var(--font);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1500px;margin-inline:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.nav a{color:var(--ink2);font-weight:700;text-decoration:none}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--ink2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:3px;background:var(--surface);border-radius:999px;padding:3px;box-shadow:0 0 0 1px var(--line)}
.seg button{padding:7px 14px;border-radius:999px;font-weight:700;color:var(--ink2);font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.days button[aria-pressed=true]{background:var(--amber);color:#12202B}
.search{height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;min-width:220px;flex:1;max-width:340px}
.zoom{margin-left:auto;display:flex;gap:4px;align-items:center}
.zoom button{height:36px;min-width:36px;padding:0 10px;border-radius:10px;font-weight:800;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset}
.goal{background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:0 0 0 1px var(--line);color:var(--ink2);font-weight:600}
.goal b{color:var(--ink)}
.board{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:minmax(0,1fr)}}

/* lanes */
.lanes{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:auto;max-height:calc(100vh - 230px);min-height:260px}
.grid{position:relative;width:max-content;min-width:100%}
.ruler{position:sticky;top:0;z-index:5;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.lab{position:sticky;left:0;z-index:4;width:var(--lab);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;min-width:0}
.track{position:relative;width:var(--w);flex:none;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:var(--pxh) 100%}
.ruler .track{height:30px;background-image:none}
.tick{position:absolute;top:8px;font-size:12px;font-weight:700;color:var(--ink2);transform:translateX(4px)}
.tickline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.dens{display:flex;height:8px;border-bottom:1px solid var(--line)}
.dens .track{display:flex;background:none}
.dens i{flex:1;background:var(--ink);opacity:var(--o)}
.sub-row{display:flex;height:28px;background:var(--bg);border-bottom:1px solid var(--line)}
.sub-row .lab{background:var(--bg);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.row{display:flex;height:46px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover .lab,.row.sel .lab{background:var(--bg)}
.row.sel{box-shadow:inset 3px 0 0 var(--ink)}
.lab .t{min-width:0;flex:1}
.lab .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .t small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink3);background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset;font-size:16px;line-height:1}
.heart[aria-pressed=true]{color:var(--red);background:var(--red-soft);box-shadow:none}
.k-time{--kc:var(--green);--kb:var(--green-soft)}
.k-task{--kc:var(--amber-ink);--kb:var(--amber-soft)}
.k-mix{--kc:var(--mix);--kb:var(--mix-soft)}
.ev{position:absolute;top:7px;height:32px;border-radius:9px;background:var(--kb);color:var(--kc);box-shadow:0 0 0 1.5px var(--kc) inset;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden}
.ev.open{background:transparent;overflow:visible;box-shadow:none}
.ev.open::before{content:"";position:absolute;inset:0;border-radius:9px;border:2px dashed var(--kc);opacity:.55}
.ev.open.liked{background:var(--kb)}
.ev.liked{box-shadow:0 0 0 3px var(--ink) inset}
.ev.open .in{position:sticky;left:calc(var(--lab) + 8px);background:var(--surface);border-radius:6px;padding:2px 8px;z-index:1}
.ev .p{font-size:13px}
.now{position:absolute;top:30px;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.now::before{content:"now";position:absolute;top:-22px;left:-14px;font-size:10px;font-weight:800;background:var(--red);color:#fff;border-radius:6px;padding:1px 5px}
.empty{padding:36px;text-align:center;color:var(--ink2)}

/* details */
.panel{position:sticky;top:16px;background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:16px;display:grid;gap:10px}
.panel h2{font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--kb);color:var(--kc)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--bg);border-radius:12px;padding:8px 10px}
.facts small{display:block;font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.facts b{font-size:15px}
.panel p{color:var(--ink2)}
.items{display:grid;gap:2px;font-size:14px;color:var(--ink2)}
.items div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.items b{color:var(--ink)}
.warn{background:var(--amber-soft);color:var(--amber-ink);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.big-like{height:44px;border-radius:12px;font-weight:800;box-shadow:0 0 0 1.5px var(--line) inset;background:var(--surface)}
.big-like[aria-pressed=true]{background:var(--red-soft);color:var(--red);box-shadow:none}
.hint{color:var(--ink3);font-size:14px;padding:18px 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
@media (max-width:980px){
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;border-radius:20px 20px 0 0;max-height:75vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px #0006}
  .lanes{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="nav"><a href="/">← Pont</a></div>
  <header><h1 id="title">Program</h1><p class="sub">What runs when. Dashed bands are open for hours and you choose the time, solid bars have fixed hours. Click a row for the details, and heart the ones you want.</p></header>
  <div class="bar">
    <div class="seg days" id="days" role="group" aria-label="Day"></div>
    <div class="seg" id="filters" role="group" aria-label="Show"></div>
    <input class="search" id="q" type="search" placeholder="Search events or rooms" aria-label="Search">
    <div class="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zfit">Fit</button><button id="zin" aria-label="Zoom in">+</button></div>
  </div>
  <p class="goal" id="goal"></p>
  <div class="board">
    <div class="lanes" id="lanes"><p class="empty">Loading the program…</p></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <div class="legend"><span><i style="background:var(--green)"></i>Points per time</span><span><i style="background:var(--amber-ink)"></i>Points per task</span><span><i style="background:var(--mix)"></i>Mixed or fixed award</span></div>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TM = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
const KIND = { time: 'Points per time', task: 'Points per task', mix: 'Mixed' };
let DOC = null, E = [], byId = {};
const S = { day: '', filter: 'all', q: '', z: 1, sel: null };
let likes = new Set();
try { const l = JSON.parse(localStorage.getItem('pont-program-likes') || 'null'); if (Array.isArray(l)) likes = new Set(l); } catch {}
const saveLikes = () => { try { localStorage.setItem('pont-program-likes', JSON.stringify([...likes])); } catch {} };

/* ---------- the points of staying a number of minutes (the same maths as the app) ---------- */
function earn(e, minutes) {
  if (e.model === 'flat') return minutes >= e.e - e.s ? e.cap : 0;
  if (e.model === 'rate') { const d = Math.min(minutes, e.maxMin || Infinity); return Math.min(Math.floor(d / e.block) * e.rate, e.cap ?? Infinity); }
  let left = minutes, pts = 0;
  for (const t of [...e.items].sort((a, b) => b.pts / b.min - a.pts / a.min)) { const take = Math.min(1, left / t.min); if (take <= 0) break; pts += t.pts * take; left -= t.min * take; }
  return Math.floor(pts + 1e-9);
}
const maxPts = e => earn(e, e.e - e.s);
const perHour = e => earn(e, Math.min(60, e.e - e.s));
const prep = o => {
  const e = { rule: '', bonus: '', bring: '', note: '', check: '', items: [], home: [], ...o };
  e.s = TM(o.from); e.e = TM(o.to); e.open = e.e - e.s >= 240;
  e.kind = o.kind || (o.model === 'rate' ? 'time' : o.model === 'flat' ? 'mix' : 'task');
  return e;
};
const todayText = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const nowOf = key => { const d = DOC.days.find(x => x.key === key); if (!d || d.date !== todayText()) return null; const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const dayEvents = () => E.filter(e => e.day === S.day);
const domain = () => { const ev = dayEvents(); return ev.length ? [Math.floor(Math.min(...ev.map(e => e.s)) / 60) * 60, Math.ceil(Math.max(...ev.map(e => e.e)) / 60) * 60] : [480, 720]; };
const passes = e => (S.filter === 'all' || (S.filter === 'liked' && likes.has(e.id)) || (S.filter === 'fixed' && !e.open) || (S.filter === 'open' && e.open))
  && (!S.q || (e.title + ' ' + e.room).toLowerCase().includes(S.q.toLowerCase()));

/* ---------- drawing ---------- */
function drawBar() {
  $('#days').innerHTML = DOC.days.map(d => `<button data-day="${esc(d.key)}" aria-pressed="${S.day === d.key}">${esc(d.label)}</button>`).join('');
  $('#filters').innerHTML = [['all', 'All'], ['liked', `Liked (${[...likes].filter(id => byId[id]).length})`], ['fixed', 'Fixed hours'], ['open', 'Open']].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('');
}
function drawGoal() {
  const g = DOC.goal, day = DOC.days.find(d => d.key === g.dayKey), firsts = DOC.days.map(d => d.label.split(' ')[0]);
  const name = day ? (new Set(firsts).size === firsts.length ? day.label.split(' ')[0] : day.label) : '';
  $('#goal').hidden = !(g.total > 0);
  $('#goal').innerHTML = `The goal: <b>${g.total} points</b> in all${g.dayMin > 0 && name ? `, at least <b>${g.dayMin}</b> of them on <b>${esc(name)}</b>` : ''}.`;
}
function drawLanes() {
  const el = $('#lanes'), [d0, d1] = domain(), lab = innerWidth < 700 ? 150 : 250;
  const avail = Math.max(300, (el.clientWidth || 800) - lab - 4);
  const pxh = Math.max(40, avail / ((d1 - d0) / 60)) * S.z, w = (d1 - d0) / 60 * pxh, px = m => (m - d0) / 60 * pxh;
  const list = dayEvents().filter(passes).sort((a, b) => a.open - b.open || a.s - b.s || a.e - b.e);
  const hours = []; for (let h = d0; h <= d1; h += 60) hours.push(h);
  const dens = []; for (let m = d0; m < d1; m += 15) dens.push(dayEvents().filter(e => e.s <= m && e.e > m).length);
  const max = Math.max(1, ...dens), now = nowOf(S.day);
  if (!list.length) { el.innerHTML = '<p class="empty">Nothing matches. Change the filter or the search.</p>'; return; }
  el.innerHTML = `<div class="grid" style="--lab:${lab}px;--pxh:${pxh}px;--w:${w}px">
    <div class="ruler"><div class="lab"></div><div class="track">${hours.map(h => `<span class="tickline" style="left:${px(h)}px"></span><span class="tick" style="left:${px(h)}px">${hm(h)}</span>`).join('')}</div></div>
    <div class="dens" title="How many things are open"><div class="lab" style="height:8px"></div><div class="track">${dens.map(n => `<i style="--o:${(n / max * .8).toFixed(2)}"></i>`).join('')}</div></div>
    ${list.map((e, i) => `${i === 0 || list[i - 1].open !== e.open ? `<div class="sub-row"><div class="lab">${e.open ? 'Open for hours: go any time' : 'Fixed hours'}</div></div>` : ''}
      <div class="row k-${e.kind}${S.sel === e.id ? ' sel' : ''}" data-open="${esc(e.id)}"><div class="lab"><div class="t"><b>${esc(e.title)}</b><small>${esc(e.room)}</small></div>
        <button class="heart" data-like="${esc(e.id)}" aria-pressed="${likes.has(e.id)}" aria-label="${likes.has(e.id) ? 'Remove from liked' : 'Like'} ${esc(e.title)}">${likes.has(e.id) ? '♥' : '♡'}</button></div>
        <div class="track"><div class="ev${e.open ? ' open' : ''}${likes.has(e.id) ? ' liked' : ''}" style="left:${px(e.s)}px;width:${px(e.e) - px(e.s)}px"><span class="${e.open ? 'in' : ''}">${e.open ? 'open ' : ''}${hm(e.s)}–${hm(e.e)}</span>${e.open ? '' : `<span class="p">${perHour(e)} p</span>`}</div></div></div>`).join('')}
    ${now !== null && now >= d0 && now <= d1 ? `<div class="now" id="now" style="left:${px(now) + lab}px"></div>` : ''}
  </div>`;
}
function drawPanel() {
  const p = $('#panel'), e = byId[S.sel];
  if (!e) { p.innerHTML = '<p class="hint">Click an event to see its points, rules and what to bring.</p>'; if (innerWidth <= 980) p.hidden = true; return; }
  p.hidden = false;
  const liked = likes.has(e.id);
  p.className = `panel k-${e.kind}`;
  p.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="chip">${KIND[e.kind]}</span><button class="linkish" id="closepanel" type="button">Close</button></div>
    <h2>${esc(e.title)}</h2>
    <div class="facts"><div><small>When</small><b>${hm(e.s)}–${hm(e.e)}</b></div><div><small>Where</small><b>${esc(e.room)}</b></div>
      <div><small>First hour</small><b>${perHour(e)} points</b></div><div><small>Everything</small><b>${maxPts(e)} points</b></div></div>
    ${e.rule || e.bonus || e.note ? `<p>${esc(e.rule)}${e.bonus ? ` <b>Bonus:</b> ${esc(e.bonus)}.` : ''}${e.note ? ' ' + esc(e.note) : ''}</p>` : ''}
    ${e.open ? '<p>Open for hours: go at any time.</p>' : ''}
    ${e.model === 'tasks' && e.items.length > 1 ? `<div class="items">${e.items.map(t => `<div><span>${esc(t.name)}</span><b>${t.pts} p · about ${t.min} min</b></div>`).join('')}${e.home.map(t => `<div><span>${esc(t.name)}</span><b>${t.pts} p</b></div>`).join('')}</div><p style="font-size:12px;color:var(--ink3)">The minutes per task are a guess.</p>` : ''}
    ${e.bring ? `<p><b>Bring:</b> ${esc(e.bring)}</p>` : ''}
    ${e.check ? `<div class="warn">Check: ${esc(e.check)}</div>` : ''}
    <button class="big-like" data-like="${esc(e.id)}" aria-pressed="${liked}">${liked ? '♥ Liked' : '♡ Like'}</button>`;
}
const draw = () => { drawBar(); drawGoal(); drawLanes(); drawPanel(); };

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  const like = t.closest('[data-like]'); if (like) { ev.stopPropagation(); const id = like.dataset.like; likes.has(id) ? likes.delete(id) : likes.add(id); saveLikes(); draw(); return; }
  const day = t.closest('[data-day]'); if (day) { S.day = day.dataset.day; S.sel = null; draw(); return; }
  const f = t.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; draw(); return; }
  if (t.id === 'closepanel') { S.sel = null; draw(); return; }
  if (t.id === 'zin') { S.z = Math.min(4, S.z * 1.25); drawLanes(); return; }
  if (t.id === 'zout') { S.z = Math.max(0.6, S.z / 1.25); drawLanes(); return; }
  if (t.id === 'zfit') { S.z = 1; drawLanes(); return; }
  const row = t.closest('[data-open]'); if (row) { S.sel = S.sel === row.dataset.open ? null : row.dataset.open; drawLanes(); drawPanel(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sel) { S.sel = null; drawLanes(); drawPanel(); } });
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); drawLanes(); });
addEventListener('resize', () => drawLanes());
// the red line of "now" moves with the clock
setInterval(() => { if (DOC && !document.hidden) drawLanes(); }, 60000);

/* ---------- start: ask the server for the program ---------- */
async function boot() {
  try {
    const res = await fetch('/public/program');
    if (!res.ok) throw new Error('status ' + res.status);
    DOC = await res.json();
    E = DOC.events.map(prep); byId = Object.fromEntries(E.map(e => [e.id, e]));
    if (!E.length || !DOC.days.length) throw new Error('empty');
  } catch (e) {
    $('#lanes').innerHTML = '<p class="empty">The program could not be loaded, or there is none yet. Try again in a moment.</p>'; $('#panel').hidden = true; return;
  }
  likes = new Set([...likes].filter(id => byId[id]));
  S.day = (DOC.days.find(d => d.date === todayText()) || DOC.days[0]).key;
  $('#title').textContent = DOC.title; document.title = DOC.title + ' · program';
  draw();
}
boot();
</script>
</body>
</html>
