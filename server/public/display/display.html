<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reader display</title>
<link rel="stylesheet" href="/display-assets/display.css">
</head>
<body>
<main id="stage" data-state="idle" aria-live="polite">
  <header>
    <span id="reader" class="reader"></span>
    <span id="live" class="live" data-ok="false">Connecting…</span>
  </header>

  <section id="idle" class="idle" hidden>
    <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Tap your card</h1>
    <p id="idle-sub"></p>
  </section>

  <section id="result" class="result" hidden>
    <div class="photo" id="photo" aria-hidden="true"></div>
    <p id="name" class="name"></p>
    <h2 id="headline" class="headline"></h2>
    <ul id="details" class="details"></ul>
    <p id="balance" class="balance" hidden></p>
  </section>

  <section id="entry" class="idle" hidden>
    <h1>Enter the code</h1>
    <p>Each reader has a 6-digit code. An admin finds it under Readers in the admin site.</p>
    <form id="entry-form" class="entry" autocomplete="off">
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="6-digit code" placeholder="······">
      <button type="submit">Open</button>
    </form>
    <p id="entry-note" class="note" role="alert"></p>
  </section>

  <footer>
    <button id="leave" type="button" class="quiet" hidden>Use a different reader</button>
    <button id="sound" type="button" hidden></button>
  </footer>
</main>
<script src="/display-assets/display.js"></script>
</body>
</html>
